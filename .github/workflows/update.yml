name: Update portfolio data

on:
  schedule:
    # GitHub cron is UTC. US market hours are 9:30-16:00 ET = 13:30-20:00 UTC (EDT) / 14:30-21:00 UTC (EST).
    # Every 15 min, 13:00-20:45 UTC, Mon-Fri (covers the whole session in EDT, and to 15:45 ET in EST):
    - cron: "*/15 13-20 * * 1-5"
    # Once after the close: 21:10 UTC = 17:10 EDT / 16:10 EST, Mon-Fri:
    - cron: "10 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Build data and commit (retries from a fresh origin/main if a trade landed meanwhile)
        env:
          # Optional repo variable (Settings > Secrets and variables > Actions > Variables), e.g.
          # https://<user>.github.io/<repo>/data/portfolio.json - lets the offline file try for fresher data.
          DASHBOARD_REMOTE_URL: ${{ vars.DASHBOARD_REMOTE_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # bash -e: a failed quote fetch fails the run and leaves the last good data in place
            python scripts/build_data.py
            python scripts/history_csv.py
            python scripts/current_csv.py
            python scripts/roll_csv.py
            python scripts/intraday_csv.py
            python scripts/build_standalone.py
            git add data dist
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "data: update $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebuilding on top of origin/main"
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
